# ==============================================================================
# WORKFLOW DE DEPLOY CONTÍNUO (CD)
# ==============================================================================
# Automatiza o deploy da API (Fase 2) no ambiente de produção.

name: Deploy to Production

# Gatilho: Executa o workflow em eventos de push na branch 'main'.
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy API to Server
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # PASSO 1: CONEXÃO SSH
      # ------------------------------------------------------------------------
      # Conecta ao servidor de produção utilizando chaves SSH armazenadas de 
      # forma segura nos GitHub Secrets.
      - name: Conexão e Execução no Servidor
        uses: appleboy/ssh-action@v1.0.3
        with:
          # Credenciais requeridas para a autenticação SSH.
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          
          # --------------------------------------------------------------------
          # PASSO 2: SCRIPT DE ATUALIZAÇÃO E DEPLOY
          # --------------------------------------------------------------------
          # Comandos executados sequencialmente no terminal do servidor remoto.
          # O caminho do diretório deve corresponder à instalação real.
          script: |
            echo "Iniciando rotina de deploy..."
            
            # Navega até o diretório raiz do projeto
            cd /var/www/minha-assinatura
            
            # Sincroniza as alterações da branch main
            git pull origin main
            
            # Navega até o diretório do backend e reconstrói os contêineres Docker
            cd api
            docker-compose up -d --build
            
            echo "Rotina de deploy finalizada."