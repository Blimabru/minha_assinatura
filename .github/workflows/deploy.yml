# ==============================================================================
# WORKFLOW DE DEPLOY CONTÍNUO (CD)
# ==============================================================================
# Automatiza o deploy da API (Fase 2) no ambiente de produção.

name: Deploy to Production

# Gatilho: Executa o workflow em eventos de push na branch 'main'.
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy API to Server
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------------------
      # PASSO 1: CHECKOUT DO CÓDIGO
      # ------------------------------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4

      # ------------------------------------------------------------------------
      # PASSO 2: INSTALAR CLOUDFLARED NO RUNNER
      # ------------------------------------------------------------------------
      - name: Install cloudflared
        run: |
          echo "Instalando cloudflared no runner do GitHub..."
          curl -L --output cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

      # ------------------------------------------------------------------------
      # PASSO 3: CONFIGURAR CHAVE SSH NO RUNNER
      # ------------------------------------------------------------------------
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # Desabilita verificação estrita de host para evitar bloqueios interativos no terminal
          echo "StrictHostKeyChecking no" >> ~/.ssh/config

      # ------------------------------------------------------------------------
      # PASSO 4: EXECUTAR DEPLOY VIA TÚNEL DO CLOUDFLARE
      # ------------------------------------------------------------------------
      - name: Run Deploy via Cloudflare Tunnel
        run: |
          echo "Conectando ao servidor protegido por Cloudflare Tunnel..."
          ssh -i ~/.ssh/id_rsa -o ProxyCommand="/usr/bin/cloudflared access ssh --hostname %h --id ${{ secrets.CF_CLIENT_ID }} --secret ${{ secrets.CF_CLIENT_SECRET }}" ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "Iniciando rotina de deploy no servidor..."
            
            # Navega até o diretório raiz do projeto
            cd /var/www/minha-assinatura
            
            # Sincroniza as alterações da branch main
            git pull origin main
            
            # Navega até o diretório do backend e reconstrói os contêineres Docker
            cd api
            docker-compose up -d --build
            
            # Sincroniza a estrutura do banco de dados externo com o novo Schema da API
            docker-compose run --rm api npx prisma db push
            
            echo "Rotina de deploy finalizada com sucesso."
          EOF