# ==============================================================================
# DOCKER COMPOSE - ORQUESTRAÇÃO DE AMBIENTE
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # SERVIÇO: API (NestJS)
  # ----------------------------------------------------------------------------
  api:
    container_name: minha_assinatura_api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # A injeção ocorre lendo as chaves do arquivo .env no mesmo diretório
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # SERVIÇO: BANCO DE DADOS (PostgreSQL)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: minha_assinatura_db
    environment:
      # A injeção ocorre lendo as chaves do arquivo .env no mesmo diretório
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
  